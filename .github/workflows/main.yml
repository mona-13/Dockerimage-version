name: API Call Workflow

on:
  push:
    branches:
      - main

jobs:
  api-call:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker (if using Docker)
        uses: docker/setup-buildx-action@v2

      - name: Run API server (localhost:8080)
        run: |
          docker run -d -p 8080:8080 your-api-image
          
      - name: Call API from workflow
        run: |
          curl http://localhost:8080/api  # Or use `host.docker.internal` if in Docker container
